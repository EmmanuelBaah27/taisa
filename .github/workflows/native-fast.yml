name: Native Fast Checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: native-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-fast:
    name: Native Fast Checks
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version | grep 'Build version 17B100'
      - name: Install pinned XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen version)" = "Version: 2.46.0"
      - name: Install workflow verifier dependencies
        run: brew install ripgrep
      - uses: actions/cache@v4
        with:
          path: apple/Packages/TaisaFoundation/.build
          key: native-fast-swift-${{ runner.os }}-${{ hashFiles('apple/Packages/TaisaFoundation/Package.resolved') }}
          restore-keys: native-fast-swift-${{ runner.os }}-
      - run: npm ci
      - name: Verify native Apple contracts and packages
        run: npm run verify:native-apple:fast
