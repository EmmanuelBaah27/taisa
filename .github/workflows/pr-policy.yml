name: Trusted PR Policy

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: trusted-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Trusted PR Policy
    runs-on: ubuntu-latest
    steps:
      # pull_request_target loads this workflow and these scripts from protected main.
      # Never check out or execute candidate code in this job.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - name: Read candidate paths without executing candidate code
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo,
              pull_number: context.payload.pull_request.number,
              per_page: 100,
            });
            fs.writeFileSync('changed-paths.txt', `${files.map((file) => file.filename).join('\n')}\n`);
      - name: Classify with protected rules
        id: classify
        run: bash scripts/native-apple/classify-ci-risk.sh < changed-paths.txt >> "${GITHUB_OUTPUT}"
      - name: Validate contract during calibration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DETECTED_RISKS: ${{ steps.classify.outputs.detected_risks }}
          PR_CONTRACT_MODE: report
        run: node scripts/native-apple/validate-pr-contract.mjs
