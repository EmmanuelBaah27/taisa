name: Native design system

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-design-system:
    name: Design System Compliance
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify:native-design-system
