name: Native Apple Full Verification

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]
  push:
    tags: ['v*']
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

concurrency:
  group: native-full-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'schedule' && 'nightly' || github.event_name == 'workflow_dispatch' && format('manual-{0}', github.run_id) || format('release-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  classify-native-impact:
    name: Classify native impact
    runs-on: ubuntu-latest
    outputs:
      native_required: ${{ steps.classify.outputs.native_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Detect product-native changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if test "${EVENT_NAME}" != "pull_request"; then
            echo "native_required=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          native_required=false
          while IFS= read -r changed_path; do
            case "${changed_path}" in
              scripts/native-apple/__tests__/*)
                ;;
              apple/*|scripts/native-apple/*|package.json|package-lock.json)
                native_required=true
                break
                ;;
            esac
          done < <(git diff --name-only "${BASE_SHA}" "${HEAD_SHA}")
          echo "native_required=${native_required}" >> "${GITHUB_OUTPUT}"

  verify-native-apple:
    name: Native Apple Full Verification
    needs: [classify-native-impact]
    if: github.event_name != 'pull_request' || (needs.classify-native-impact.outputs.native_required == 'true' && contains(github.event.pull_request.labels.*.name, 'merge-ready'))
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version | grep 'Build version 17B100'
      - name: Install pinned iOS platform
        run: |
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS; then
              exit 0
            fi
            test "${attempt}" -lt 3 || exit 1
            sleep 15
          done
      - name: Install pinned XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen version)" = "Version: 2.46.0"
      - name: Install workflow verifier dependencies
        run: brew install ripgrep
      - uses: actions/cache@v4
        with:
          path: apple/Packages/TaisaFoundation/.build
          key: native-full-swift-${{ runner.os }}-${{ hashFiles('apple/Packages/TaisaFoundation/Package.resolved') }}
          restore-keys: native-full-swift-${{ runner.os }}-
      - run: npm ci
      - name: Verify native Apple foundation
        env:
          TAISA_NATIVE_ARTIFACTS: ${{ runner.temp }}/native-apple-artifacts
        run: npm run verify:native-apple:all
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-apple-test-results
          path: |
            ${{ runner.temp }}/native-apple-artifacts/*.xcresult
            ${{ runner.temp }}/native-apple-artifacts/**/*.png
          if-no-files-found: warn

  native-merge-gate:
    name: Native Merge Gate
    if: always() && github.event_name == 'pull_request'
    needs: [classify-native-impact, verify-native-apple]
    runs-on: ubuntu-latest
    env:
      FULL_RESULT: ${{ needs.verify-native-apple.result }}
      NATIVE_REQUIRED: ${{ needs.classify-native-impact.outputs.native_required }}
      HAS_MERGE_READY: ${{ contains(github.event.pull_request.labels.*.name, 'merge-ready') }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Require full verification for this pull request head
        run: |
          echo "Evaluating native verification for ${PR_HEAD_SHA}"
          if test "${NATIVE_REQUIRED}" != "true"; then
            echo "This workflow-only pull request does not require the full native matrix."
            exit 0
          fi
          test "${HAS_MERGE_READY}" = "true" || {
            echo "Apply the merge-ready label to start full native verification." >&2
            exit 1
          }
          test "${FULL_RESULT}" = "success" || {
            echo "Full native verification result: ${FULL_RESULT}" >&2
            exit 1
          }
