name: Native Apple foundation

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-native-apple:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Select pinned Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_26.1.1.app
          xcodebuild -version | grep 'Build version 17B100'
      - name: Install pinned XcodeGen
        run: |
          brew install xcodegen
          test "$(xcodegen version)" = "Version: 2.46.0"
      - run: npm ci
      - name: Verify native Apple foundation
        env:
          TAISA_NATIVE_ARTIFACTS: ${{ runner.temp }}/native-apple-artifacts
        run: npm run verify:native-apple:all
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-apple-test-results
          path: |
            ${{ runner.temp }}/native-apple-artifacts/*.xcresult
            ${{ runner.temp }}/native-apple-artifacts/**/*.png
          if-no-files-found: warn
