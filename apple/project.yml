name: Taisa
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
configs:
  Debug: debug
  Preview: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Preview: Config/Preview.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SUPPORTS_MACCATALYST: NO
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
packages:
  TaisaFoundation:
    path: Packages/TaisaFoundation
targets:
  Taisa:
    type: application
    platform: iOS
    info:
      path: Config/TaisaInfo.plist
      properties:
        UIBackgroundModes: [remote-notification]
    sources:
      - path: TaisaApp
      - path: Generated
    settings:
      base:
        PRODUCT_NAME: Taisa
        INFOPLIST_KEY_CFBundleDisplayName: Taisa
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_TaisaEnvironment: "$(TAISA_ENVIRONMENT)"
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/TaisaDev.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Taisa.entitlements
    dependencies:
      - package: TaisaFoundation
        product: TaisaCore
      - package: TaisaFoundation
        product: TaisaContracts
      - package: TaisaFoundation
        product: TaisaDesignSystem
      - package: TaisaFoundation
        product: TaisaStorage
      - package: TaisaFoundation
        product: TaisaCloudKit
  TaisaPreview:
    type: application
    platform: iOS
    sources:
      - path: TaisaPreview
      - path: Generated
    settings:
      base:
        PRODUCT_NAME: TaisaPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.taisa.app.preview
        TAISA_ENVIRONMENT: preview
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG TAISA_PREVIEW"
        INFOPLIST_KEY_CFBundleDisplayName: Taisa Preview
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_TaisaEnvironment: "$(TAISA_ENVIRONMENT)"
        CODE_SIGN_ENTITLEMENTS: Config/TaisaPreview.entitlements
    dependencies:
      - package: TaisaFoundation
        product: TaisaCore
      - package: TaisaFoundation
        product: TaisaContracts
      - package: TaisaFoundation
        product: TaisaDesignSystem
      - package: TaisaFoundation
        product: TaisaPreviewSupport
      - package: TaisaFoundation
        product: TaisaStorage
  TaisaUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TaisaUnitTests
    dependencies:
      - target: Taisa
      - package: TaisaFoundation
        product: TaisaStorage
  TaisaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaisaUITests
    dependencies:
      - target: Taisa
  TaisaPreviewUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: TaisaPreviewUITests
    dependencies:
      - target: TaisaPreview
schemes:
  Taisa-Dev:
    build:
      targets:
        Taisa: all
    run:
      config: Debug
    analyze:
      config: Debug
    test:
      config: Debug
      targets:
        - TaisaUnitTests
        - TaisaUITests
    profile:
      config: Debug
    archive:
      config: Debug
  Taisa-Preview:
    build:
      targets:
        TaisaPreview:
          - run
          - test
          - analyze
    run:
      config: Preview
    analyze:
      config: Preview
    test:
      config: Preview
      targets:
        - TaisaPreviewUITests
  Taisa:
    build:
      targets:
        Taisa: all
    run:
      config: Release
    analyze:
      config: Release
    test:
      config: Debug
      targets:
        - TaisaUnitTests
        - TaisaUITests
    profile:
      config: Release
    archive:
      config: Release
